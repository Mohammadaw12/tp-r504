version: "3"

services:
  app1:
    build: ./appli
    networks:
      - tplb

  app2:
    build: ./appli
    networks:
      - tplb

  nginx:
    build: ./nginx
    container_name: nginx-lb
    ports:
      - "8080:80"
    depends_on:
      - app1
      - app2
    networks:
      - tplb

networks:
  tplb:
    driver: bridge
